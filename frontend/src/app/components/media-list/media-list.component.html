<div class="list-header">
  <h1>Catalogue</h1>

  <label class="filter">
    <span>Type</span>
    <select id="type-filter" name="type-filter" (change)="onFilterChange($any($event.target).value)">
      <option value="">Tous</option>
      <option *ngFor="let t of types" [value]="t">{{ t }}</option>
    </select>
  </label>
</div>

<p *ngIf="loading()" class="status">Chargement du catalogue…</p>
<p *ngIf="error()" class="error">{{ error() }}</p>

<ng-container *ngIf="!loading() && !error()">
  <p *ngIf="medias().length === 0" class="empty">
    Rien à afficher pour l'instant.
    <a routerLink="/medias/nouveau">Ajoute le premier média</a>.
  </p>

  <div class="grid" *ngIf="medias().length > 0">
    <a *ngFor="let media of medias()" [routerLink]="['/medias', media.id]" class="card" [class]="'badge-' + media.type">
      <img *ngIf="media.imageUrl" [src]="media.imageUrl" [alt]="media.titre" class="cover" />
      <div class="cover-placeholder" *ngIf="!media.imageUrl">{{ media.titre.charAt(0) }}</div>

      <div class="card-body">
        <span class="badge" [class]="'badge-' + media.type">{{ media.type }}</span>
        <h3>{{ media.titre }}</h3>
        <p *ngIf="media.annee" class="year">{{ media.annee }}</p>
      </div>
    </a>
  </div>
</ng-container>
