services:

  postgres:
    image: postgres:16-alpine
    container_name: rmm-postgres
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: rmm-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build: ./catalog-service
    container_name: rmm-catalog-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASSWORD: catalog_pass
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  review-service:
    build: ./review-service
    container_name: rmm-review-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mongo
      DB_PORT: 27017
      DB_NAME: review_db
      # nom du service Docker, résolu automatiquement par le réseau interne Compose
      CATALOG_SERVICE_URL: http://catalog-service:8081
    depends_on:
      mongo:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rmm-frontend
    ports:
      - "4200:80"
    depends_on:
      catalog-service:
        condition: service_healthy
